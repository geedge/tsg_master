variables:
  GIT_STRATEGY: "clone"
  BUILD_IMAGE_CENTOS7: "git.mesalab.cn:7443/mesa_platform/build-env:master"
  BUILD_IMAGE_CENTOS8: "git.mesalab.cn:7443/mesa_platform/build-env:rockylinux"
  BUILD_PADDING_PREFIX: /tmp/padding_for_CPACK_RPM_BUILD_SOURCE_DIRS_PREFIX_PREFIX_PREFIX_PREFIX_PREFIX_PREFIX/
  INSTALL_PREFIX: "/home/mesasoft/sapp_run/"
  INSTALL_DEPENDENCY_LIBRARY: libMESA_handle_logger-devel  libcjson-devel libMESA_field_stat2-devel sapp  sapp-devel framework_env  libMESA_prof_load-devel http-devel dns-devel ftp-devel mail-devel ssl-devel-2.0.13.fda2e4a librdkafka-devel libmaatframe-devel qquic-2.0.5.96f9ce3 mesa_sip-devel gtp-devel libMESA_htable-devel libasan mrzcpd rapidjson-devel libMESA_jump_layer-devel stratum-devel rdp-devel dtls-devel-1.0.10.ab7166e

stages:
- build

.build_before_script:
  before_script:
  - mkdir -p $BUILD_PADDING_PREFIX/$CI_PROJECT_NAMESPACE/
  - ln -s $CI_PROJECT_DIR $BUILD_PADDING_PREFIX/$CI_PROJECT_PATH
  - cd $BUILD_PADDING_PREFIX/$CI_PROJECT_PATH
  - chmod +x ./ci/travis.sh
  - yum makecache
  - yum install -y elfutils-libelf-devel


.build_by_travis_for_centos7:
  stage: build
  image: $BUILD_IMAGE_CENTOS7
  extends: .build_before_script
  script:
    - yum install -y libmnl-devel
    - yum install -y libnfnetlink-devel
    - ./ci/travis.sh
      - cd build
  tags:
  - share

.build_by_travis_for_centos8:
  stage: build
  image: $BUILD_IMAGE_CENTOS8
  extends: .build_before_script
  script:
    - dnf --enablerepo=powertools install -y libmnl-devel
    - dnf --enablerepo=powertools install -y libnfnetlink-devel
    - ./ci/travis.sh
  tags:
    - share
  
branch_build_debug_for_centos7:
  stage: build
  extends: .build_by_travis_for_centos7
  variables:
    BUILD_TYPE: Debug
  except:
    - /^develop.*$/i
    - /^master.*$/i
    - tags

branch_build_release_for_centos7:
  stage: build
  variables:
    BUILD_TYPE: RelWithDebInfo
  extends: .build_by_travis_for_centos7
  except:
    - /^develop.*$/i
    - /^master.*$/i
    - tags

develop_build_debug_for_centos7:
  stage: build
  extends: .build_by_travis_for_centos7
  variables:
    BUILD_TYPE: Debug
    PACKAGE: 1
    UPLOAD_RPM: 1
    ASAN_OPTION: ADDRESS
    TESTING_VERSION_BUILD: 1
    PULP3_REPO_NAME: tsg-testing-x86_64.el7
    PULP3_DIST_NAME: tsg-testing-x86_64.el7
  artifacts:
    name: "tsg_master-$CI_COMMIT_REF_NAME-debug"
    paths:
      - build/*.rpm
  only:
    - /^develop.*$/i
    - /^master.*$/i

develop_build_release_for_centos7:
  stage: build
  extends: .build_by_travis_for_centos7
  variables:
    BUILD_TYPE: RelWithDebInfo
    PACKAGE: 1
    UPLOAD_RPM: 1
    TESTING_VERSION_BUILD: 1
    PULP3_REPO_NAME: tsg-testing-x86_64.el7
    PULP3_DIST_NAME: tsg-testing-x86_64.el7
  artifacts:
    name: "tsg_master-$CI_COMMIT_REF_NAME-release"
    paths:
      - build/*.rpm
  only:
    - /^develop.*$/i
    - /^master.*$/i

release_build_debug_for_centos7:
  stage: build
  variables:
    BUILD_TYPE: Debug
    PACKAGE: 1
    UPLOAD_RPM: 1
    PULP3_REPO_NAME: tsg-stable-x86_64.el7
    PULP3_DIST_NAME: tsg-stable-x86_64.el7
  extends: .build_by_travis_for_centos7
  artifacts:
    name: "tsg_master-$CI_COMMIT_REF_NAME-release"
    paths:
      - build/*.rpm
  only:
    - tags

release_build_release_for_centos7:
  stage: build
  variables:
    BUILD_TYPE: RelWithDebInfo
    PACKAGE: 1
    UPLOAD_RPM: 1
    UPLOAD_SYMBOL_FILES: 1
    SYMBOL_TARGET: tsg_master
    PULP3_REPO_NAME: tsg-stable-x86_64.el7
    PULP3_DIST_NAME: tsg-stable-x86_64.el7
  extends: .build_by_travis_for_centos7
  artifacts:
    name: "tsg_master-$CI_COMMIT_REF_NAME-release"
    paths:
      - build/*.rpm
  only:
    - tags

